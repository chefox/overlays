<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRL Chat Trigger Overlay (Native WS)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #animation-container {
            position: absolute;
            top: 50px;
            left: 50px;
            display: none;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ffcc;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px #00ffcc;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div id="animation-container">
        ⚡ BOOM! ⚡
    </div>

    <script>
        const channelName = 'technogumanitarij';

        // Подключаемся напрямую к Twitch IRC через WebSocket
        const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

        ws.onopen = () => {
            // Анонимная авторизация для чтения чата
            ws.send('PASS SCHMOOPIE');
            ws.send('NICK justinfan12345');
            ws.send('JOIN #' + channelName.toLowerCase());
            console.log('Подключено к чату Twitch!');
        };

        ws.onmessage = (event) => {
            const data = event.data;

            // Twitch требует отвечать PING на PONG, чтобы соединение не обрывалось
            if (data.startsWith('PING')) {
                ws.send('PONG ' + data.split(' ')[1]);
                return;
            }

            // Обработка сообщений чата (PRIVMSG)
            if (data.includes('PRIVMSG')) {
                // Извлекаем текст сообщения из сырой IRC-строки
                const parts = data.split(':');
                const message = parts.slice(2).join(':').trim().toLowerCase();

                if (message === '!boom') {
                    triggerAnimation();
                }
            }
        };

        ws.onclose = () => {
            console.log('Соединение с чатом закрыто. Переподключение...');
            setTimeout(() => location.reload(), 5000); // Автопереподключение при обрыве
        };

        function triggerAnimation() {
            const box = document.getElementById('animation-container');
            box.style.display = 'block';

            setTimeout(() => {
                box.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
