<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VHS Audio Reactive Glitch Overlay</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Сканирующие линии VHS */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.3) 50%
            );
            background-size: 100% 4px;
        }

        /* Canvas для шума и глитча */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        /* VHS интерфейс */
        .vhs-ui {
            position: fixed;
            top: 25px;
            left: 25px;
            color: #00ff55;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 3;
            letter-spacing: 2px;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="vhs-ui">PLAY &#9654;<br><span id="vhs-time">00:00:00</span></div>
    <canvas id="glitch-canvas"></canvas>

    <script>
        const canvas = document.getElementById('glitch-canvas');
        const ctx = canvas.getContext('2d');
        const vhsTime = document.getElementById('vhs-time');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Счетчик времени
        setInterval(() => {
            const now = new Date();
            vhsTime.textContent = now.toTimeString().split(' ')[0];
        }, 1000);

        // Автозапуск при загрузке страницы
        window.addEventListener('load', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Принудительная активация контекста, если браузер перевел его в suspended
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                const source = audioCtx.createMediaStreamSource(stream);
                const analyser = audioCtx.createAnalyser();
                
                analyser.fftSize = 256;
                source.connect(analyser);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function draw() {
                    requestAnimationFrame(draw);
                    analyser.getByteFrequencyData(dataArray);

                    // Низкие частоты (басы / удары)
                    let lowSum = 0;
                    for (let i = 0; i < 10; i++) lowSum += dataArray[i];
                    let lowAvg = lowSum / 10;

                    // Высокие частоты (голос / звон)
                    let highSum = 0;
                    for (let i = 40; i < 80; i++) highSum += dataArray[i];
                    let highAvg = highSum / 40;

                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    // Зернистость
                    let noiseParticles = Math.floor(highAvg * 1.5) + 30;
                    ctx.fillStyle = `rgba(255, 255, 255, ${0.03 + highAvg / 1200})`;
                    for (let i = 0; i < noiseParticles; i++) {
                        let x = Math.random() * canvas.width;
                        let y = Math.random() * canvas.height;
                        let w = Math.random() * 4 + 1;
                        let h = Math.random() * 2 + 1;
                        ctx.fillRect(x, y, w, h);
                    }

                    // Цветовые вспышки от высоких частот
                    if (highAvg > 30) {
                        ctx.fillStyle = `rgba(${highAvg * 2}, 0, 255, ${highAvg / 2000})`;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }

                    // Полосы срыва трекинга от басов
                    if (lowAvg > 25) {
                        let numBars = Math.floor(lowAvg / 15);
                        for (let i = 0; i < numBars; i++) {
                            let barY = Math.random() * canvas.height;
                            let barHeight = Math.random() * (lowAvg / 2) + 2;
                            
                            ctx.fillStyle = Math.random() > 0.5 
                                ? `rgba(255, 0, 85, ${lowAvg / 400})` 
                                : `rgba(0, 255, 220, ${lowAvg / 400})`;
                            
                            ctx.fillRect(0, barY, canvas.width, barHeight);

                            ctx.fillStyle = `rgba(255, 255, 255, ${lowAvg / 250})`;
                            ctx.fillRect(Math.random() * canvas.width, barY, Math.random() * 300 + 50, 1.5);
                        }
                    }
                }

                draw();

            } catch (err) {
                console.error("Ошибка автозапуска аудио:", err);
            }
        });
    </script>
</body>
</html>
