<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Overlay Engine</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #ambient-glitch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .reaction-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
            background: transparent;
            display: none;
            z-index: 2;
        }
    </style>
</head>
<body>

    <!-- Ambient background glitch layer -->
    <canvas id="ambient-glitch-canvas"></canvas>

    <!-- Reaction modules -->
    <iframe id="boom-frame" class="reaction-frame" src="reactions/boom.html"></iframe>

    <script>
        // --- 1. AMBIENT BASE GLITCH ENGINE ---
        const canvas = document.getElementById('ambient-glitch-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const chars = '░▒▓█▄▀■▌▐0123456789ABCDEF!@#$%^&*()_+-=/?><~';
        const palette = [
            '#000000', '#0000D8', '#D80000', '#D800D8', 
            '#00D800', '#00D8D8', '#D8D800', '#FFFFFF', 
            '#00FFFF', '#FF00FF', '#FFFF00'
        ];
        const CELL_SIZE = 16;
        let clusters = [];

        function randomRange(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        let isGlitching = false;
        let nextStateTime = Date.now() + randomRange(3000, 6000);

        function updateGlitchState() {
            const now = Date.now();
            if (now >= nextStateTime) {
                isGlitching = !isGlitching;
                if (isGlitching) {
                    nextStateTime = now + randomRange(2000, 5000);
                } else {
                    nextStateTime = now + randomRange(10000, 60000);
                    clusters = [];
                }
            }
        }

        function createCluster() {
            const cols = Math.floor(canvas.width / CELL_SIZE);
            const rows = Math.floor(canvas.height / CELL_SIZE);
            const w = randomRange(2, 6);
            const h = randomRange(1, 4);
            const startX = randomRange(0, cols - w);
            const startY = randomRange(0, rows - h);
            const duration = randomRange(4, 12);

            const paper = palette[Math.floor(Math.random() * palette.length)];
            let ink = palette[Math.floor(Math.random() * palette.length)];
            while (ink === paper) ink = palette[Math.floor(Math.random() * palette.length)];

            clusters.push({
                x: startX, y: startY, w, h, paper, ink, duration, age: 0,
                offsetX: (Math.random() - 0.5) * 12
            });
        }

        function renderAmbientGlitch() {
            updateGlitchState();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isGlitching) {
                if (Math.random() < 0.35 && clusters.length < 4) {
                    createCluster();
                }

                ctx.font = 'bold 14px "Courier New", monospace';
                ctx.textBaseline = 'top';

                for (let i = clusters.length - 1; i >= 0; i--) {
                    const c = clusters[i];

                    for (let r = 0; r < c.h; r++) {
                        for (let col = 0; col < c.w; col++) {
                            const posX = (c.x + col) * CELL_SIZE + c.offsetX;
                            const posY = (c.y + r) * CELL_SIZE;

                            ctx.fillStyle = c.paper;
                            ctx.fillRect(posX, posY, CELL_SIZE, CELL_SIZE);

                            ctx.fillStyle = c.ink;
                            ctx.fillText(chars[Math.floor(Math.random() * chars.length)], posX + 2, posY + 1);
                        }
                    }

                    const clusterY = c.y * CELL_SIZE;
                    const clusterH = c.h * CELL_SIZE;
                    for (let l = 0; l < randomRange(2, 5); l++) {
                        const vhsY = clusterY + Math.random() * clusterH;
                        const vhsWidth = (c.w * CELL_SIZE) + randomRange(50, 200);
                        const vhsX = (c.x * CELL_SIZE) - (Math.random() * 40);

                        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(0, 255, 255, 0.7)' : 'rgba(255, 0, 255, 0.7)';
                        ctx.fillRect(vhsX, vhsY, vhsWidth, randomRange(1, 3));
                    }

                    c.age++;
                    if (c.age >= c.duration) clusters.splice(i, 1);
                }
            }

            requestAnimationFrame(renderAmbientGlitch);
        }

        renderAmbientGlitch();


        // --- 2. PARSE URL PARAMETERS ---
        const urlParams = new URLSearchParams(window.location.search);
        // Fallback to 'technogumanitarij' if parameters are missing in the URL
        const channelName = urlParams.get('channel') || 'technogumanitarij';
        const targetUser = urlParams.get('user') || channelName;


        // --- 3. TWITCH CHAT LISTENER VIA WEBSOCKET ---
        const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

        ws.onopen = () => {
            ws.send('PASS SCHMOOPIE');
            ws.send('NICK justinfan12345');
            ws.send('JOIN #' + channelName.toLowerCase());
            console.log(`Connected to channel: #${channelName}, listening to user: ${targetUser}`);
        };

        ws.onmessage = (event) => {
            const data = event.data;
            if (data.startsWith('PING')) {
                ws.send('PONG ' + data.split(' ')[1]);
                return;
            }

            if (data.includes('PRIVMSG')) {
                const prefix = data.split(' ')[0];
                let sender = '';
                if (prefix.startsWith(':')) {
                    sender = prefix.substring(1).split('!')[0].toLowerCase();
                }

                const parts = data.split(':');
                const message = parts.slice(2).join(':'.trim()).toLowerCase();

                // Check if sender matches targetUser from URL parameters
                if (sender === targetUser.toLowerCase()) {
                    if (message === '!boom') {
                        triggerReaction('boom-frame', 5000);
                    }
                }
            }
        };

        function triggerReaction(frameId, duration) {
            const frame = document.getElementById(frameId);
            frame.style.display = 'block';
            frame.contentWindow.postMessage('play', '*');

            setTimeout(() => {
                frame.style.display = 'none';
            }, duration);
        }

        ws.onclose = () => {
            setTimeout(() => location.reload(), 5000);
        };
    </script>
</body>
</html>
