<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZX Spectrum Localized Glitch Overlay</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: transparent;
        }
    </style>
</head>
<body>
    <canvas id="glitch-canvas"></canvas>

    <script>
        const canvas = document.getElementById('glitch-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 8-битные символы и артефакты ZX Spectrum
        const chars = '░▒▓█▄▀■▌▐0123456789ABCDEF!@#$%^&*()_+-=/?><~';

        // Оригинальная палитра ZX Spectrum (Paper / Ink)
        const palette = [
            '#000000', // Черный
            '#0000D8', // Синий
            '#D80000', // Красный
            '#D800D8', // Пурпурный
            '#00D800', // Зеленый
            '#00D8D8', // Голубой
            '#D8D800', // Желтый
            '#FFFFFF', // Белый
            '#00FFFF', // Яркий Голубой
            '#FF00FF', // Яркий Пурпурный
            '#FFFF00'  // Яркий Желтый
        ];

        const CELL_SIZE = 16; // Размер знакоместа (16x16 px)
        let clusters = [];

        // Создание одного случайного локального глитч-пятна
        function createCluster() {
            const cols = Math.floor(canvas.width / CELL_SIZE);
            const rows = Math.floor(canvas.height / CELL_SIZE);

            // Размеры кластера (от 2x1 до 6x4 знакомест)
            const w = Math.floor(Math.random() * 5) + 2;
            const h = Math.floor(Math.random() * 4) + 1;

            // Случайные координаты на сетке экрана
            const startX = Math.floor(Math.random() * (cols - w));
            const startY = Math.floor(Math.random() * (rows - h));

            // Время жизни кластера (очень короткая вспышка: 3–8 кадров)
            const duration = Math.floor(Math.random() * 6) + 3;

            // Выбор цветов Paper / Ink для этого блока (Attribute Clash)
            const paper = palette[Math.floor(Math.random() * palette.length)];
            let ink = palette[Math.floor(Math.random() * palette.length)];
            while (ink === paper) {
                ink = palette[Math.floor(Math.random() * palette.length)];
            }

            clusters.push({
                x: startX,
                y: startY,
                w: w,
                h: h,
                paper: paper,
                ink: ink,
                duration: duration,
                age: 0,
                // Легкий горизонтальный сдвиг блока
                offsetX: (Math.random() - 0.5) * 10
            });
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Генерация новых пятен с ограничением максимального количества на экране
            if (Math.random() < 0.4 && clusters.length < 4) {
                createCluster();
            }

            ctx.font = 'bold 14px "Courier New", monospace';
            ctx.textBaseline = 'top';

            // Отрисовка всех активных глитч-пятен
            for (let i = clusters.length - 1; i >= 0; i--) {
                const c = clusters[i];

                for (let r = 0; r < c.h; r++) {
                    for (let col = 0; col < c.w; col++) {
                        const posX = (c.x + col) * CELL_SIZE + c.offsetX;
                        const posY = (c.y + r) * CELL_SIZE;

                        // 1. Фон знакоместа (Paper)
                        ctx.fillStyle = c.paper;
                        ctx.fillRect(posX, posY, CELL_SIZE, CELL_SIZE);

                        // 2. Быстро меняющийся символ (Ink)
                        ctx.fillStyle = c.ink;
                        const char = chars[Math.floor(Math.random() * chars.length)];
                        ctx.fillText(char, posX + 2, posY + 1);
                    }
                }

                c.age++;
                if (c.age >= c.duration) {
                    clusters.splice(i, 1);
                }
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
