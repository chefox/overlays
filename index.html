<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZX Spectrum + VHS Strip Glitch Overlay</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: transparent;
        }
    </style>
</head>
<body>
    <canvas id="glitch-canvas"></canvas>

    <script>
        const canvas = document.getElementById('glitch-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const chars = '░▒▓█▄▀■▌▐0123456789ABCDEF!@#$%^&*()_+-=/?><~';
        const palette = [
            '#000000', '#0000D8', '#D80000', '#D800D8',
            '#00D800', '#00D8D8', '#D8D800', '#FFFFFF',
            '#00FFFF', '#FF00FF', '#FFFF00'
        ];

        const CELL_SIZE = 16;
        let activeClusters = [];
        let isGlitching = false;

        function scheduleNextGlitch() {
            isGlitching = false;
            activeClusters = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const pauseDuration = Math.floor(Math.random() * 20000) + 10000;
            setTimeout(startGlitchBurst, pauseDuration);
        }

        function startGlitchBurst() {
            isGlitching = true;
            generateClusters();

            const burstDuration = Math.floor(Math.random() * 4000) + 1000;
            setTimeout(scheduleNextGlitch, burstDuration);
        }


        function generateClusters() {
            const cols = Math.floor(canvas.width / CELL_SIZE);
            const rows = Math.floor(canvas.height / CELL_SIZE);
            
            const count = Math.floor(Math.random() * 5) + 1;
            activeClusters = [];

            for (let i = 0; i < count; i++) {
                const w = Math.floor(Math.random() * 6) + 2;
                const h = Math.floor(Math.random() * 3) + 1;
                const startX = Math.floor(Math.random() * (cols - w));
                const startY = Math.floor(Math.random() * (rows - h));

                const paper = palette[Math.floor(Math.random() * palette.length)];
                let ink = palette[Math.floor(Math.random() * palette.length)];
                while (ink === paper) {
                    ink = palette[Math.floor(Math.random() * palette.length)];
                }

                activeClusters.push({
                    x: startX,
                    y: startY,
                    w: w,
                    h: h,
                    paper: paper,
                    ink: ink
                });
            }
        }

        function drawVHSLines(cluster) {
            const startY = cluster.y * CELL_SIZE;
            const endY = (cluster.y + cluster.h) * CELL_SIZE;
            const clusterX = cluster.x * CELL_SIZE;
            const clusterW = cluster.w * CELL_SIZE;

            const numLines = Math.floor(Math.random() * 8) + 3;

            for (let i = 0; i < numLines; i++) {
                const lineY = startY + Math.random() * (endY - startY);
                const lineHeight = Math.random() * 2 + 1;
                
                const lineX = clusterX - Math.random() * 30;
                const lineWidth = clusterW + Math.random() * 60;

                const colors = [
                    'rgba(0, 255, 255, 0.8)',
                    'rgba(255, 0, 255, 0.8)',
                    'rgba(255, 255, 255, 0.9)'
                ];
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                ctx.fillRect(lineX, lineY, lineWidth, lineHeight);

                if (Math.random() > 0.5) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                    ctx.fillRect(lineX - 20, lineY, lineWidth * 0.5, 1);
                }
            }
        }


        function render() {
            if (isGlitching) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.font = 'bold 14px "Courier New", monospace';
                ctx.textBaseline = 'top';

                if (Math.random() < 0.25) {
                    generateClusters();
                }

                activeClusters.forEach(c => {
                    for (let r = 0; r < c.h; r++) {
                        for (let col = 0; col < c.w; col++) {
                            const posX = (c.x + col) * CELL_SIZE;
                            const posY = (c.y + r) * CELL_SIZE;

                            ctx.fillStyle = c.paper;
                            ctx.fillRect(posX, posY, CELL_SIZE, CELL_SIZE);

                            ctx.fillStyle = c.ink;
                            const char = chars[Math.floor(Math.random() * chars.length)];
                            ctx.fillText(char, posX + 2, posY + 1);
                        }
                    }

                    drawVHSLines(c);
                });
            }

            requestAnimationFrame(render);
        }


        scheduleNextGlitch();
        render();
    </script>
</body>
</html>
